name: Publish data packs

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example data-2026.08.3
        required: true
        default: data-2026.08.3
  push:
    branches: [main]
    paths:
      - '.github/data-release-2026.08.3.trigger'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag || '' }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "tag=data-2026.08.3" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          fi
      - name: Assemble design concepts 2026.08.3
        run: python scripts/apply_design_concepts_2026_08_3.py
      - name: Validate
        run: python scripts/validate.py
      - name: Build packages
        run: python scripts/build_packs.py
      - name: Generate Excel snapshots
        run: python scripts/generate_excel.py --output-root excel
      - name: Generate catalog
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: python scripts/generate_catalog.py --repository KiYouJyo/UrbanPlanToolbox_Data --tag "$RELEASE_TAG" --write-source
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; retaining immutable assets."
          else
            gh release create "$RELEASE_TAG" \
              dist/*.uptdata dist/SHA256SUMS.txt dist/catalog-v1.json excel/*/*.xlsx \
              --title "UrbanPlanToolbox Data $RELEASE_TAG" \
              --notes "Official UrbanPlanToolbox data-pack release. Design Concepts 2026.08.3 contains 109 reviewed concepts and complete Chinese, Japanese and English localization for titles, definitions, categories, project types, tags, case notes and source notes. Packages are validated, versioned independently from the app, and intended for local offline use after download. Human-readable Excel snapshots are included for quick review."
          fi
      - name: Commit canonical v3 data, catalog and Excel snapshots on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packs/design-concepts/data/concepts.json packs/design-concepts/manifest.source.json catalog/catalog-v1.json excel/
          if git diff --cached --quiet; then
            echo "Canonical data, catalog and Excel snapshots unchanged."
          else
            git commit -m "data: publish design concepts 2026.08.3"
            git push origin HEAD:main
          fi
