name: Publish initial data release

on:
  push:
    branches: [main]
    paths:
      - '.publish-initial-data-release'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate
        run: python scripts/validate.py
      - name: Build packages
        run: python scripts/build_packs.py
      - name: Generate Excel snapshots
        run: python scripts/generate_excel.py --output-root excel
      - name: Generate catalog
        run: python scripts/generate_catalog.py --repository KiYouJyo/UrbanPlanToolbox_Data --tag data-2026.08.1 --write-source
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view data-2026.08.1 >/dev/null 2>&1; then
            echo 'Release data-2026.08.1 already exists; refusing to overwrite immutable assets.'
            exit 1
          fi
          gh release create data-2026.08.1 \
            dist/*.uptdata dist/SHA256SUMS.txt dist/catalog-v1.json excel/*/*.xlsx \
            --title 'UrbanPlanToolbox Data data-2026.08.1' \
            --notes 'Initial official UrbanPlanToolbox data-pack release. Includes validated .uptdata packages, fixed catalog metadata, SHA-256 sums and human-readable Excel snapshots.'
      - name: Update fixed catalog endpoint and Excel snapshots on main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/catalog-v1.json excel/
          if git diff --cached --quiet; then
            echo 'Catalog and Excel snapshots unchanged.'
          else
            git commit -m 'data: publish catalog and Excel snapshots for data-2026.08.1'
            git push origin HEAD:main
          fi
