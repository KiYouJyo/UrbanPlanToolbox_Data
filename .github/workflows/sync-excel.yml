name: Sync Excel snapshots

on:
  push:
    branches: [main]
    paths:
      - 'packs/**'
      - 'scripts/generate_excel.py'
      - '.github/workflows/sync-excel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate canonical data
        run: python scripts/validate.py
      - name: Generate versioned Excel snapshots
        run: python scripts/generate_excel.py --output-root excel
      - name: Validate generated Excel containers
        run: |
          python - <<'PY'
          import pathlib, zipfile
          files = sorted(pathlib.Path('excel').glob('*/*.xlsx'))
          assert len(files) >= 3, 'Expected at least three Excel snapshots'
          required = {'[Content_Types].xml', 'xl/workbook.xml', 'xl/styles.xml'}
          for p in files:
              with zipfile.ZipFile(p) as z:
                  names = set(z.namelist())
                  missing = required - names
                  assert not missing, f'{p}: missing {sorted(missing)}'
                  assert any(n.startswith('xl/worksheets/sheet') for n in names), f'{p}: no worksheets'
                  print(p, p.stat().st_size)
          PY
      - name: Commit synchronized Excel snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add excel/
          if git diff --cached --quiet; then
            echo "Excel snapshots already synchronized."
          else
            git commit -m "data: sync Excel database snapshots"
            git push origin HEAD:main
          fi
