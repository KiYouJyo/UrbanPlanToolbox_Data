name: Data validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble design concepts 2026.08.2
        run: python scripts/merge_design_concepts_2026_08_2.py
      - name: Validate data
        run: python scripts/validate.py
      - name: Build data packs
        run: python scripts/build_packs.py
      - name: Generate dry-run catalog
        run: python scripts/generate_catalog.py --repository KiYouJyo/UrbanPlanToolbox_Data --tag data-validation
      - name: Generate dry-run Excel snapshots
        run: python scripts/generate_excel.py --output-root dist/excel
      - name: Inspect packages and Excel snapshots
        run: |
          python - <<'PY'
          import pathlib, zipfile

          for p in pathlib.Path('dist').glob('*.uptdata'):
              with zipfile.ZipFile(p) as z:
                  names = z.namelist()
                  assert names[0] == 'manifest.json'
                  assert all(not n.startswith('/') and '..' not in pathlib.PurePosixPath(n).parts for n in names)
                  print(p.name, names)

          excel_files = sorted(pathlib.Path('dist/excel').glob('*/*.xlsx'))
          assert len(excel_files) == 3, f'Expected exactly three current Excel snapshots, got {len(excel_files)}'
          required = {'[Content_Types].xml', 'xl/workbook.xml', 'xl/styles.xml'}
          for p in excel_files:
              with zipfile.ZipFile(p) as z:
                  names = set(z.namelist())
                  missing = required - names
                  assert not missing, f'{p}: missing {sorted(missing)}'
                  assert any(n.startswith('xl/worksheets/sheet') for n in names), f'{p}: no worksheets'
                  print(p.name, p.stat().st_size)
          PY
